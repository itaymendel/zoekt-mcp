name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linter
        run: bun run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run type check
        run: bun run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Package footprint
        run: |
          set -euo pipefail
          npm pack --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/pack.json"
          files=$(jq -r '.[0].files[].path' "$RUNNER_TEMP/pack.json" | LC_ALL=C sort | tr '\n' ' ')
          expected="CHANGELOG.md LICENSE README.md dist/index.js package.json "
          [ "$files" = "$expected" ] || { echo "unexpected tarball files: $files"; exit 1; }
          tgz="$RUNNER_TEMP/$(jq -r '.[0].filename' "$RUNNER_TEMP/pack.json")"
          mkdir "$RUNNER_TEMP/install"
          cd "$RUNNER_TEMP/install"
          npm init -y > /dev/null
          npm install "$tgz" --ignore-scripts --no-audit --no-fund
          count=$(npm ls --all --parseable | wc -l)
          [ "$count" -eq 2 ] || { echo "expected 2 installed packages, got $count"; npm ls --all; exit 1; }
          ./node_modules/.bin/zoekt-mcp --version
          node "$GITHUB_WORKSPACE/scripts/smoke-stdio.mjs" --bin ./node_modules/.bin/zoekt-mcp

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  dist-smoke:
    name: Dist smoke (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Print version
        run: node dist/index.js --version

      - name: Print help
        run: node dist/index.js --help

      - name: Stdio smoke test
        run: node scripts/smoke-stdio.mjs --entry dist/index.js

      - name: HTTP smoke test
        run: node scripts/smoke-http.mjs --entry dist/index.js
